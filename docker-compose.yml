version: '3.8'

# ==============================================================================
# MindMate AI - Multi-Container Deployment for IBM Datathon
# Target Environment: IBM LinuxONE Community Cloud (L1CC) / s390x & Local Docker
# Services:
#   1. web: Java 21 Spring Boot MVC + SQLite (Persistent Storage)
#   2. ai-engine: PyTorch 2.x + XGBoost 2.x + IBM Granite Reasoning Microservice
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: Python Hybrid AI Engine (PyTorch + XGBoost + IBM Granite)
  # ----------------------------------------------------------------------------
  ai-engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: mindmate-ai-engine
    ports:
      - "${AI_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - IBM_GRANITE_API_KEY=${IBM_GRANITE_API_KEY:-}
      - IBM_GRANITE_MODEL=${IBM_GRANITE_MODEL:-ibm/granite-13b-chat-v2}
      - TELUM_ACCELERATION_ENABLED=true
    restart: unless-stopped
    networks:
      - mindmate-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Service 2: MindMate Spring Boot Web Platform
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindmate-web
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/mindmate;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=LEGACY;NON_KEYWORDS=USER
      - SPRING_DATASOURCE_DRIVER=org.h2.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect
      - IBM_AI_SERVICE_URL=http://ai-engine:5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - IBM_GRANITE_API_KEY=${IBM_GRANITE_API_KEY:-}
    volumes:
      # Persistent volume for SQLite database across container restarts
      - mindmate_db_data:/app/data
    depends_on:
      ai-engine:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mindmate-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  mindmate_db_data:
    driver: local

networks:
  mindmate-network:
    driver: bridge
