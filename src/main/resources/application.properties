# Spring Boot MindMate AI Configuration
spring.application.name=mindmate-ai
server.port=8080

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:mindmate.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf MVC View Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Gemini AI Service Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/

# Application Banner & File Upload
spring.main.banner-mode=console
spring.servlet.multipart.max-file-size=5MB
