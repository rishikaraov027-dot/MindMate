# Spring Boot MindMate AI Configuration
spring.application.name=mindmate-ai
server.port=${SERVER_PORT:8080}

# Database Configuration (Defaults to SQLite for local development; supports H2 for s390x / Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:mindmate.db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.sqlite.JDBC}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf MVC View Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Gemini AI Service Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/

# Application Banner & File Upload
spring.main.banner-mode=console
spring.servlet.multipart.max-file-size=5MB

# AI Provider Selector ('auto', 'granite', 'gemini', or 'local')
ai.provider=${AI_PROVIDER:auto}

# IBM Datathon AI Configuration (PyTorch + XGBoost + IBM Granite)
ibm.ai.service.url=${IBM_AI_SERVICE_URL:http://localhost:5000}
ibm.ai.service.enabled=${IBM_AI_SERVICE_ENABLED:true}
ibm.ai.service.timeout=${IBM_AI_SERVICE_TIMEOUT:2500}
ibm.granite.api.key=${IBM_GRANITE_API_KEY:}
ibm.granite.model=${IBM_GRANITE_MODEL:ibm/granite-13b-chat-v2}
