<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Account')}"></head>
<body>

    <header th:replace="~{fragments/layout :: header('register')}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="wrap">
        <div class="auth-container">
            <div class="auth-panel">
                <div style="text-align: center; margin-bottom: 25px;">
                    <span style="font-size: 32px; color: var(--green);">✿</span>
                    <h2 style="font-size: 24px; margin: 8px 0 4px;">Join MindMate</h2>
                    <p class="muted small">Start tracking your well-being journey</p>
                </div>

                <form th:action="@{/register}" th:object="${registerForm}" method="post">
                    <div class="form-group">
                        <label for="displayName">Your Name</label>
                        <input id="displayName" th:field="*{displayName}" type="text" required placeholder="e.g. Alex" autofocus>
                        <p class="form-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">Error</p>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input id="username" th:field="*{username}" type="text" required placeholder="Choose a username">
                        <p class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error</p>
                    </div>

                    <div class="form-group">
                        <label for="email">Email <small style="color: var(--muted);">(Optional)</small></label>
                        <input id="email" th:field="*{email}" type="email" placeholder="name@college.edu">
                        <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" th:field="*{password}" type="password" required placeholder="At least 6 characters">
                        <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>
                    </div>

                    <button type="submit" class="btn full">Create Free Account &rarr;</button>
                </form>

                <div style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted);">
                    Already have an account? <a th:href="@{/login}" style="color: var(--green); font-weight: 700; text-decoration: underline;">Sign In</a>
                    <br><br>
                    <a th:href="@{/}" class="navbtn-ghost" style="display: inline-block;">Continue as Guest &rarr;</a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
